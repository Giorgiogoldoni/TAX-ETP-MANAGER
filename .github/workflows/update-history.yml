name: Update portfolio history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/portfolio.json'
      - 'data/instruments.json'
      - 'data/targets.json'
      - 'data/watchlist.json'
      - 'scripts/fetch_history.py'
      - '.github/workflows/update-history.yml'
  schedule:
    - cron: '15 19 * * 1-5'
permissions:
  contents: write
concurrency:
  group: portfolio-history
  cancel-in-progress: false
jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market data client
        run: python -m pip install --upgrade pip yfinance
      - name: Download daily history from 2026-01-01
        run: python scripts/fetch_history.py
      - name: Commit historical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "No historical data changes."
          else
            git commit -m "Update daily portfolio price history"
            for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            echo "Push attempt $attempt failed; retrying after syncing with main."
            sleep 2
          done
          exit 1
          fi
