name: Update portfolio history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/portfolio.json'
      - 'data/instruments.json'
      - 'data/targets.json'
      - 'data/watchlist.json'
      - 'scripts/fetch_history.py'
      - 'scripts/fetch_quotes.py'
      - 'scripts/fetch_observatory_etfs.py'
      - 'data/observatory.json'
      - '.github/workflows/update-history.yml'
  schedule:
    # Daily ~11:00 Rome (10:00 UTC in winter)
    - cron: '0 10 * * *'
    # Daily ~23:00 Rome (22:00 UTC in winter)
    - cron: '0 22 * * *'
permissions:
  contents: write
concurrency:
  group: portfolio-history
  cancel-in-progress: false
jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market data client
        run: python -m pip install --upgrade pip yfinance
      - name: Download intraday latest quotes
        if: github.event_name == 'schedule' && github.event.schedule == '0 10 * * *'
        run: python scripts/fetch_quotes.py
      - name: Download daily closing history
        if: github.event_name != 'schedule' || github.event.schedule == '0 22 * * *'
        run: python scripts/fetch_history.py
      - name: Update accumulating ETF verification history
        if: github.event_name != 'schedule' || github.event.schedule == '15 19 * * 1-5'
        run: python scripts/fetch_observatory_etfs.py
      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/observatory_etf_history.json
          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "Update portfolio market data"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              echo "Push attempt $attempt failed; retrying after syncing with main."
              sleep 2
            done
            exit 1
          fi
